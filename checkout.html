<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout — AHANKARAKA</title>
<meta name="description" content="Secure checkout — UPI, Google Pay, super.money, credit & debit cards, net banking, wallets, EMI and Cash on Delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" type="image/svg+xml" href="assets/logo/brandmark.svg">

<meta property="og:type" content="website">
<meta property="og:site_name" content="AHANKARAKA">
<meta property="og:title" content="Secure Checkout — AHANKARAKA">
<meta property="og:description" content="Secure checkout — UPI, Google Pay, super.money, credit &amp; debit cards, net banking, wallets, EMI and Cash on Delivery.">
<meta property="og:url" content="https://ahankaraka.vercel.app/checkout.html">
<meta property="og:image" content="https://ahankaraka.vercel.app/assets/og/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="AHANKARAKA — Fine Temple Jewellery">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Secure Checkout — AHANKARAKA">
<meta name="twitter:description" content="Secure checkout — UPI, Google Pay, super.money, credit &amp; debit cards, net banking, wallets, EMI and Cash on Delivery.">
<meta name="twitter:image" content="https://ahankaraka.vercel.app/assets/og/og.jpg">
<meta name="theme-color" content="#2c1e20">
</head>
<body data-page="checkout">
<div id="ahx-header"></div>

<div class="container">
  <div class="crumb"><a href="index.html">Home</a><span>/</span><a href="collections.html">Shop</a><span>/</span><b>Checkout</b></div>
  <div class="co-steps">
    <span class="s on"><span class="n">1</span>Information</span><span class="sep"></span>
    <span class="s on"><span class="n">2</span>Shipping</span><span class="sep"></span>
    <span class="s on"><span class="n">3</span>Payment</span><span class="sep"></span>
    <span class="s"><span class="n">4</span>Confirmation</span>
    <span class="secure-badge"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Secure · 256-bit SSL</span>
  </div>
</div>

<div class="container">
  <div id="coMain">
    <div class="checkout-wrap">
      <form id="coForm">
        <!-- contact -->
        <div class="co-block">
          <h3><span class="n">1</span>Contact</h3>
          <div class="field"><label>Email address</label><input type="email" required placeholder="you@email.com"></div>
          <div class="field"><label>Mobile number</label><input type="tel" required placeholder="+91  XXXXX XXXXX"></div>
        </div>
        <!-- shipping -->
        <div class="co-block">
          <h3><span class="n">2</span>Shipping Address</h3>
          <div class="co-row">
            <div class="field"><label>First name</label><input required></div>
            <div class="field"><label>Last name</label><input required></div>
          </div>
          <div class="field"><label>Address</label><input required placeholder="House no, street, area"></div>
          <div class="co-row">
            <div class="field"><label>City</label><input required></div>
            <div class="field"><label>State</label><input required></div>
          </div>
          <div class="co-row">
            <div class="field"><label>PIN code</label><input required inputmode="numeric"></div>
            <div class="field"><label>Country</label><select><option>India</option><option>United States</option><option>United Kingdom</option><option>UAE</option><option>Singapore</option><option>Australia</option></select></div>
          </div>
        </div>
        <!-- payment -->
        <div class="co-block">
          <h3><span class="n">3</span>Payment Method</h3>

          <label class="pay-method active">
            <div class="pm-head">
              <input type="radio" name="pay" checked>
              <span class="pm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg></span>
              <span class="pm-name">UPI <span class="pm-tag">Instant</span></span>
              <span class="pm-marks"><img src="assets/pay/gpay.svg" alt="Google Pay"><img src="assets/pay/phonepe.svg" alt="PhonePe"><img src="assets/pay/paytm.svg" alt="Paytm"><img src="assets/pay/upi.svg" alt="UPI"></span>
            </div>
            <div class="pm-body">
              <input class="pm-field" placeholder="yourname@upi  ·  or scan the QR on the next step">
              <p class="pm-note">Pay instantly with any UPI app — Google&nbsp;Pay, PhonePe, Paytm, <b>super.money</b>, BHIM or Amazon&nbsp;Pay. You'll approve the request in your app.</p>
            </div>
          </label>

          <label class="pay-method">
            <div class="pm-head">
              <input type="radio" name="pay">
              <span class="pm-ic"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 9h20"/><path d="M5 15h4"/></svg></span>
              <span class="pm-name">Card <span class="pm-tag">No-cost EMI</span></span>
              <span class="pm-marks"><img src="assets/pay/visa.svg" alt="Visa"><img src="assets/pay/mastercard.svg" alt="Mastercard"><img src="assets/pay/rupay.svg" alt="RuPay"><img src="assets/pay/amex.svg" alt="Amex"></span>
            </div>
            <div class="pm-body">
              <input class="pm-field" placeholder="Card number" inputmode="numeric">
              <div class="co-row"><input class="pm-field" placeholder="MM / YY"><input class="pm-field" placeholder="CVV" inputmode="numeric"></div>
              <input class="pm-field" placeholder="Name on card" style="margin-bottom:6px">
              <p class="pm-note">Credit, debit &amp; prepaid cards accepted. No-cost EMI on eligible cards.</p>
            </div>
          </label>

          <label class="pay-method">
            <div class="pm-head">
              <input type="radio" name="pay">
              <span class="pm-ic"><svg viewBox="0 0 24 24"><path d="M3 21h18M4 10h16M5 10 12 4l7 6M6 10v11M18 10v11M10 10v11M14 10v11"/></svg></span>
              <span class="pm-name">Net Banking</span>
              <span class="pm-marks"><span class="mk">HDFC</span><span class="mk">ICICI</span><span class="mk">SBI</span><span class="mk">+50 banks</span></span>
            </div>
            <div class="pm-body">
              <select class="pm-field"><option>Select your bank…</option><option>HDFC Bank</option><option>ICICI Bank</option><option>State Bank of India</option><option>Axis Bank</option><option>Kotak Mahindra Bank</option><option>Other banks</option></select>
              <p class="pm-note">You'll be redirected to your bank to complete payment securely.</p>
            </div>
          </label>

          <label class="pay-method">
            <div class="pm-head">
              <input type="radio" name="pay">
              <span class="pm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M16 12h.01"/></svg></span>
              <span class="pm-name">Wallets</span>
              <span class="pm-marks"><img src="assets/pay/paytm.svg" alt="Paytm"><img src="assets/pay/phonepe.svg" alt="PhonePe"><span class="mk">Amazon Pay</span></span>
            </div>
            <div class="pm-body"><p class="pm-note">Pay from your Paytm, PhonePe, Amazon Pay, Mobikwik or Freecharge wallet balance.</p></div>
          </label>

          <label class="pay-method">
            <div class="pm-head">
              <input type="radio" name="pay">
              <span class="pm-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
              <span class="pm-name">Pay Later &amp; EMI <span class="pm-tag">Flexible</span></span>
              <span class="pm-marks"><span class="mk">super.money</span><span class="mk">Simpl</span><span class="mk">LazyPay</span></span>
            </div>
            <div class="pm-body"><p class="pm-note">Split your payment or pay later with super.money, Simpl, LazyPay or no-cost EMI.</p></div>
          </label>

          <label class="pay-method">
            <div class="pm-head">
              <input type="radio" name="pay">
              <span class="pm-ic"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></span>
              <span class="pm-name">Cash on Delivery</span>
              <span class="pm-marks"><span class="mk">Pay on arrival</span></span>
            </div>
            <div class="pm-body"><p class="pm-note">Pay in cash when your order arrives. Available on in-stock pieces across India.</p></div>
          </label>

          <div class="pm-secure">
            <span class="lk"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>256-bit SSL · cards never stored</span>
            <span class="lk">Secured by <img src="assets/pay/razorpay.svg" alt="Razorpay"></span>
          </div>
        </div>

        <button type="submit" class="btn btn-fill" style="width:100%;justify-content:center">Place Order</button>
        <p class="pm-note" style="text-align:center;margin-top:12px">By placing your order you agree to our <a href="legal.html" style="border-bottom:1px solid var(--gold)">Terms</a> &amp; <a href="legal.html" style="border-bottom:1px solid var(--gold)">Privacy Policy</a>.</p>
      </form>

      <aside class="summary" id="coSummary"></aside>
    </div>
  </div>
</div>

<div id="ahx-footer"></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="assets/products.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
